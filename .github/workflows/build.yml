name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-glfw
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Bundle runtime DLL
        # The compiler runtime (libstdc++, libgcc, winpthreads) is statically
        # linked by CMakeLists.txt. The MSYS2 glfw package is shared-only
        # though, so glfw3.dll must ship alongside the exe.
        run: cp /ucrt64/bin/glfw3.dll build/
      - uses: actions/upload-artifact@v4
        with:
          name: securevault-windows
          path: |
            build/securevault.exe
            build/glfw3.dll

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libglfw3-dev libssl-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - uses: actions/upload-artifact@v4
        with:
          name: securevault-linux
          path: build/securevault
